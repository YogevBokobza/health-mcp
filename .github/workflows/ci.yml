name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # israeli-health-scrapers is a git dependency built via its own `prepare`
      # script (needs a real git checkout, not the npm cache) — plain `npm ci` covers it.
      - run: npm ci

      - run: npm run typecheck
      - run: npm test
      - run: npm run build
